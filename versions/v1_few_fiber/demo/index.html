  <script>
    (() => {
      const root = document.getElementById('few-fiber-lab-c84a');
      const data = JSON.parse(root.querySelector('#ff-data').textContent);
      const model = root.querySelector('#ff-model');
      const chart = root.querySelector('#ff-chart');
      const scrub = root.querySelector('#ff-scrub');
      const play = root.querySelector('#ff-play');
      const step = root.querySelector('#ff-step');
      const reset = root.querySelector('#ff-reset');
      const speed = root.querySelector('#ff-speed');
      const timeText = root.querySelector('#ff-time');
      const alignmentText = root.querySelector('#ff-align');
      const displacementText = root.querySelector('#ff-displacement');
      const activeText = root.querySelector('#ff-active');
      const ns = 'http://www.w3.org/2000/svg';
      const width = 760;
      const height = 500;
      const padding = 34;
      let index = 0;
      let playing = false;
      let lastTimestamp = null;
      let chartCursor = null;

      scrub.max = String(data.time.length - 1);

      function svgElement(name, attributes = {}, text = '') {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, String(value)));
        if (text) node.textContent = text;
        return node;
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      const allX = data.reference.map(point => point[0]);
      const allY = data.reference.map(point => point[1]);
      const center = data.config.cell_center;
      const radius = data.config.cell_radius;
      allX.push(center[0] - radius - 1.5, center[0] + radius + 1.5);
      allY.push(center[1] - radius - 1.5, center[1] + radius + 1.5);
      const xMin = Math.min(...allX);
      const xMax = Math.max(...allX);
      const yMin = Math.min(...allY);
      const yMax = Math.max(...allY);
      const scale = Math.min((width - 2 * padding) / (xMax - xMin), (height - 2 * padding) / (yMax - yMin));
      const xOffset = 0.5 * (width - scale * (xMin + xMax));
      const yOffset = 0.5 * (height + scale * (yMin + yMax));

      function screen(point) {
        return [xOffset + scale * point[0], yOffset - scale * point[1]];
      }

      function pointsFor(frame, beadIds) {
        return beadIds.map(bead => screen(frame[bead]).map(value => value.toFixed(2)).join(',')).join(' ');
      }

      function tractionFraction(time) {
        const ramp = data.config.force_ramp_time;
        return ramp === 0 ? 1 : Math.min(1, time / ramp);
      }

      function renderModel() {
        clear(model);
        const frame = data.positions[index];
        const weights = data.weights[index];
        const maxWeight = Math.max(...weights, 1e-12);
        const time = data.time[index];
        const pullFraction = tractionFraction(time);

        model.appendChild(svgElement('title', {}, `Fixed cell and five collagen fibers at t=${time.toFixed(2)}`));
        model.appendChild(svgElement('desc', {}, `Fibers are connected polylines. Gaussian traction is strongest on beads close to the cell surface and the weights update with deformation.`));

        const defs = svgElement('defs');
        const marker = svgElement('marker', {id: 'ff-arrow-head-c84a', markerWidth: 7, markerHeight: 7, refX: 6, refY: 3.5, orient: 'auto'});
        marker.appendChild(svgElement('path', {d: 'M0,0 L7,3.5 L0,7 Z', fill: 'var(--viz-series-4)'}));
        defs.appendChild(marker);
        model.appendChild(defs);

        data.fiberBeads.forEach(beads => {
          model.appendChild(svgElement('polyline', {
            points: pointsFor(data.reference, beads),
            fill: 'none', stroke: 'var(--border)', 'stroke-width': 1.2,
            'stroke-dasharray': '5 5', opacity: 0.7
          }));
        });

        const centerScreen = screen(center);
        model.appendChild(svgElement('circle', {
          cx: centerScreen[0], cy: centerScreen[1], r: scale * (radius + data.config.gaussian_sigma),
          fill: 'none', stroke: 'var(--viz-series-3)', 'stroke-width': 1,
          'stroke-dasharray': '4 6', opacity: 0.35
        }));
        model.appendChild(svgElement('circle', {
          cx: centerScreen[0], cy: centerScreen[1], r: scale * radius,
          fill: 'var(--muted)', stroke: 'var(--foreground)', 'stroke-width': 1.6
        }));
        model.appendChild(svgElement('text', {
          x: centerScreen[0], y: centerScreen[1] - 4,
          class: 'ff-value', 'text-anchor': 'middle'
        }, 'fixed cell'));
        model.appendChild(svgElement('text', {
          x: centerScreen[0], y: centerScreen[1] + 13,
          class: 'ff-label', 'text-anchor': 'middle'
        }, 'rigid circle'));

        data.fiberBeads.forEach((beads, fiber) => {
          model.appendChild(svgElement('polyline', {
            points: pointsFor(frame, beads), fill: 'none',
            stroke: `var(--viz-series-${(fiber % 5) + 1})`,
            'stroke-width': 2.8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
          }));
        });

        const strongest = weights
          .map((weight, bead) => ({weight, bead}))
          .filter(item => item.weight > 0.12 * maxWeight)
          .sort((a, b) => b.weight - a.weight)
          .slice(0, 14);
        strongest.forEach(({weight, bead}) => {
          const start = screen(frame[bead]);
          const dx = centerScreen[0] - start[0];
          const dy = centerScreen[1] - start[1];
          const norm = Math.max(Math.hypot(dx, dy), 1e-12);
          const arrowLength = pullFraction * (8 + 28 * weight / maxWeight);
          model.appendChild(svgElement('line', {
            x1: start[0], y1: start[1],
            x2: start[0] + arrowLength * dx / norm,
            y2: start[1] + arrowLength * dy / norm,
            stroke: 'var(--viz-series-4)', 'stroke-width': 1.7,
            opacity: 0.35 + 0.65 * weight / maxWeight,
            'marker-end': 'url(#ff-arrow-head-c84a)'
          }));
        });

        frame.forEach((point, bead) => {
          const [x, y] = screen(point);
          if (data.fixed[bead]) {
            model.appendChild(svgElement('rect', {
              x: x - 3.5, y: y - 3.5, width: 7, height: 7,
              fill: 'var(--foreground)'
            }));
          } else {
            const strength = weights[bead] / maxWeight;
            model.appendChild(svgElement('circle', {
              cx: x, cy: y, r: 2.3 + 3.7 * Math.sqrt(strength),
              fill: strength > 0.08 ? 'var(--viz-series-3)' : 'var(--background)',
              stroke: strength > 0.08 ? 'var(--viz-series-3)' : 'var(--muted-foreground)',
              'stroke-width': 1, opacity: 0.55 + 0.45 * strength
            }));
          }
        });

        model.appendChild(svgElement('text', {x: 12, y: 20, class: 'ff-label'}, 'Gaussian shell: dashed ring marks one σ outside the cell surface'));
      }

      function pathFor(values, xScale, yScale) {
        return values.map((value, i) => `${i ? 'L' : 'M'}${xScale(data.time[i]).toFixed(2)},${yScale(value).toFixed(2)}`).join(' ');
      }

      function buildChart() {
        clear(chart);
        chart.appendChild(svgElement('title', {}, 'Fiber reorganization metrics'));
        const left = 68;
        const right = 744;
        const timeMax = data.time[data.time.length - 1];
        const xScale = value => left + (right - left) * value / timeMax;
        const rows = [
          {label: 'Radial alignment', values: data.alignment, top: 18, bottom: 82, color: 'var(--viz-series-1)'},
          {label: 'RMS displacement', values: data.displacement, top: 112, bottom: 176, color: 'var(--viz-series-3)'}
        ];
        rows.forEach(row => {
          const minValue = Math.min(...row.values);
          const maxValue = Math.max(...row.values);
          const padValue = Math.max((maxValue - minValue) * 0.08, 1e-5);
          const low = Math.max(0, minValue - padValue);
          const high = maxValue + padValue;
          const yScale = value => row.bottom - (row.bottom - row.top) * (value - low) / (high - low);
          chart.appendChild(svgElement('rect', {x: left, y: row.top, width: right - left, height: row.bottom - row.top, fill: 'none', stroke: 'var(--border)'}));
          chart.appendChild(svgElement('text', {x: 4, y: row.top + 13, class: 'ff-value'}, row.label));
          chart.appendChild(svgElement('text', {x: left - 7, y: row.top + 4, class: 'ff-label ff-y-tick', 'text-anchor': 'end'}, high.toFixed(2)));
          chart.appendChild(svgElement('text', {x: left - 7, y: row.bottom + 4, class: 'ff-label ff-y-tick', 'text-anchor': 'end'}, low.toFixed(2)));
          chart.appendChild(svgElement('path', {d: pathFor(row.values, xScale, yScale), fill: 'none', stroke: row.color, 'stroke-width': 2}));
        });
        [0, timeMax / 2, timeMax].forEach(value => {
          chart.appendChild(svgElement('text', {x: xScale(value), y: 198, class: 'ff-label', 'text-anchor': 'middle'}, value.toFixed(1)));
        });
        chart.appendChild(svgElement('text', {x: right, y: 104, class: 'ff-label', 'text-anchor': 'end'}, 'time (model units)'));
        chartCursor = svgElement('line', {x1: left, y1: 12, x2: left, y2: 180, stroke: 'var(--foreground)', 'stroke-width': 1, opacity: 0.55});
        chart.appendChild(chartCursor);
      }

      function render() {
        renderModel();
        const time = data.time[index];
        timeText.innerHTML = `<strong>t = ${time.toFixed(2)}</strong>`;
        alignmentText.textContent = `radial alignment ${data.alignment[index].toFixed(3)}`;
        displacementText.textContent = `RMS displacement ${data.displacement[index].toFixed(3)}`;
        activeText.textContent = `pull ${(100 * tractionFraction(time)).toFixed(0)}%`;
        scrub.value = String(index);
        if (chartCursor) {
          const x = 68 + (744 - 68) * time / data.time[data.time.length - 1];
          chartCursor.setAttribute('x1', x);
          chartCursor.setAttribute('x2', x);
        }
      }

      function stop() {
        playing = false;
        lastTimestamp = null;
        play.textContent = 'Play';
      }

      function animate(timestamp) {
        if (!playing) return;
        if (lastTimestamp === null) lastTimestamp = timestamp;
        const elapsed = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;
        const sampleDt = data.time[1] - data.time[0];
        const advance = Math.max(1, Math.round(elapsed * Number(speed.value) / sampleDt));
        index = Math.min(data.time.length - 1, index + advance);
        render();
        if (index >= data.time.length - 1) stop();
        else requestAnimationFrame(animate);
      }

      play.addEventListener('click', () => {
        if (playing) stop();
        else {
          if (index >= data.time.length - 1) index = 0;
          playing = true;
          play.textContent = 'Pause';
          requestAnimationFrame(animate);
        }
      });
      step.addEventListener('click', () => {
        stop();
        index = Math.min(data.time.length - 1, index + 1);
        render();
      });
      reset.addEventListener('click', () => {
        stop();
        index = 0;
        render();
      });
      scrub.addEventListener('input', () => {
        stop();
        index = Number(scrub.value);
        render();
      });

      buildChart();
      render();
    })();
  </script>
</div>
